version: "3.9"

# =============================================================
# TimeStamp Proxy — Docker Compose
# Todos los servicios en red interna excepto Nginx (:80/:443)
# =============================================================

networks:
  proxy-internal:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  nginx-html:
    driver: local

services:

  # ─────────────────────────────────────────────
  # POSTGRES
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tsa_postgres
    restart: unless-stopped
    environment:
      TZ:                America/Lima
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - proxy-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No expone puertos al host — acceso solo por red interna

  # ─────────────────────────────────────────────
  # REDIS
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tsa_redis
    restart: unless-stopped
    environment:
      TZ: America/Lima
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - proxy-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # BACKEND GO
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tsa_backend
    restart: unless-stopped
    env_file: .env
    environment:
      TZ:             America/Lima
      POSTGRES_HOST:  postgres
      REDIS_HOST:     redis
    networks:
      - proxy-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Sin puertos expuestos al host — Nginx accede por red interna

  # ─────────────────────────────────────────────
  # FRONTEND NEXT.JS
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tsa_frontend
    restart: unless-stopped
    environment:
      TZ:                   America/Lima
      NEXT_PUBLIC_API_URL:  ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    networks:
      - proxy-internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────
  # NGINX — único servicio con puertos al exterior
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: tsa_nginx
    restart: unless-stopped
    environment:
      TZ: America/Lima
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-html:/var/www/certbot:ro
    networks:
      - proxy-internal
    depends_on:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
