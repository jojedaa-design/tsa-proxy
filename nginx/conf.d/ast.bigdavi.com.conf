# =============================================================
# ast.bigdavi.com — Panel de administración
# =============================================================

# Macro de security headers — se repite en cada bloque que usa add_header
# para evitar que nginx los sobreescriba (comportamiento de herencia en nginx)
map $host $dummy { default ""; }

server {
    listen 80;
    server_name ast.bigdavi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ast.bigdavi.com;

    # ── TLS ──────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ast.bigdavi.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ast.bigdavi.com-0001/privkey.pem;
    ssl_session_cache   shared:SSL_AST:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # ssl_stapling desactivado debido a problemas con el certificado
    # ssl_stapling        on;
    # ssl_stapling_verify on;

    # Panel: tamaño de body más generoso para uploads de config
    client_max_body_size 1m;

    # Rate limiting general del panel admin
    limit_req zone=admin_panel burst=30 nodelay;
    limit_req_status 429;

    # ── Security headers (a nivel server para que apliquen a todos los locations) ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header X-Frame-Options           "DENY"              always;
    add_header X-XSS-Protection          "1; mode=block"     always;
    add_header Referrer-Policy           "no-referrer"       always;
    add_header Permissions-Policy        "geolocation=()"    always;

    # ── Login endpoint — rate limiting estricto (anti brute-force) ───
    location = /api/admin/v1/auth/login {
        limit_req zone=login_strict burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Repetir security headers (nginx los pierde cuando location tiene add_header)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-Frame-Options           "DENY"              always;
        add_header Referrer-Policy           "no-referrer"       always;
        add_header Content-Security-Policy   "default-src 'none'" always;
        add_header Cache-Control             "no-store"          always;
    }

    # ── TOTP verify — también rate limiting estricto ──────────────
    location = /api/admin/v1/auth/2fa/verify {
        limit_req zone=login_strict burst=3 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-Frame-Options           "DENY"              always;
        add_header Referrer-Policy           "no-referrer"       always;
        add_header Content-Security-Policy   "default-src 'none'" always;
        add_header Cache-Control             "no-store"          always;
    }

    # ── Health/ready probe → Backend Go ─────────────────────────
    location = /ready {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header Cache-Control             "no-store"          always;
    }

    # ── API Admin → Backend Go ────────────────────────────────────
    location /api/admin/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-Frame-Options           "DENY"              always;
        add_header Referrer-Policy           "no-referrer"       always;
        add_header Content-Security-Policy   "default-src 'none'" always;
    }

    # ── Documentos legales — acceso público, permitir iframe mismo origen ──
    location /legal/ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"      always;
        add_header X-Frame-Options           "SAMEORIGIN"   always;
        add_header Referrer-Policy           "no-referrer"  always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'" always;
    }

    # ── Frontend Next.js ─────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"           always;
        add_header X-Frame-Options           "DENY"              always;
        add_header Referrer-Policy           "no-referrer"       always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'" always;

        # Cache de assets estáticos Next.js
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control             "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options    "nosniff"      always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            access_log off;
        }
    }
}
