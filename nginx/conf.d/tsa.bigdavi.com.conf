# =============================================================
# tsa.bigdavi.com — Proxy público RFC 3161
# =============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name tsa.bigdavi.com;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name tsa.bigdavi.com;

    # ── TLS ──────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ast.bigdavi.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ast.bigdavi.com-0001/privkey.pem;
    ssl_session_cache   shared:SSL_TSA:10m;
    ssl_session_timeout 1d;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # ssl_stapling desactivado debido a problemas con el certificado
    # ssl_stapling        on;
    # ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Límites para requests de timestamp ───────────────────────
    client_max_body_size 16k;   # Un TSQ RFC 3161 nunca supera 16KB

    # ── Rate limiting de borde ────────────────────────────────────
    # 20 r/s con burst de 100 → no rechaza picos legítimos cortos
    # El backend Go aplica rate limit por tenant adicional
    limit_req zone=tsa_public burst=100 nodelay;
    limit_req_status 429;

    # ── Health / ready (sin rate limit) ──────────────────────────
    location = /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── /ts — Basic Auth obligatorio (Adobe, JSignPdf, DAVISIGN preemptive) ──
    location /ts {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    20s;
    }

    # ── /tsp — TSP sin credenciales (auth por IP) o con Basic Auth ───────────
    # Para clientes que no envían Authorization header (DAVISIGN / EU DSS)
    # El backend valida: IP en allowlist del tenant + cuota + rate-limit
    location /tsp {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    20s;
    }

    # ── Endpoint público de timestamp ─────────────────────────────
    location /api/v1/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts estrictos para el proxy de timestamp
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    20s;

        # Pasar Content-Type application/timestamp-query sin modificar
        proxy_pass_request_headers on;
    }

    # ── Bloquear todo lo demás ───────────────────────────────────
    location / {
        return 404;
    }
}
