user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time '
                    'rid=$http_x_request_id';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Buffers y timeouts ───────────────────────────────────────
    client_body_buffer_size   16k;
    client_max_body_size      64k;    # TSQ max ~16KB, margen generoso
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    proxy_connect_timeout   10s;
    proxy_send_timeout      30s;
    proxy_read_timeout      30s;
    proxy_buffering         on;
    proxy_buffer_size       8k;
    proxy_buffers           8 16k;

    # ── Headers de seguridad globales ───────────────────────────
    add_header X-Content-Type-Options  "nosniff"           always;
    add_header X-Frame-Options         "DENY"              always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "no-referrer"      always;
    add_header Permissions-Policy      "geolocation=()"   always;

    # ── Rate limiting global (complementa el del backend) ───────
    # Zona para el proxy público: 10MB en memoria ≈ 160K IPs
    limit_req_zone $binary_remote_addr zone=tsa_public:10m rate=20r/s;
    # Zona para el panel admin (navegación general)
    limit_req_zone $binary_remote_addr zone=admin_panel:5m  rate=10r/s;
    # Zona estricta para el endpoint de login (anti brute-force)
    limit_req_zone $binary_remote_addr zone=login_strict:5m rate=5r/m;

    # ── DNS Resolver (Docker internal) ───────────────────────────
    # Resuelve los hostnames de contenedores cada 10s para evitar
    # IPs cacheadas cuando Docker reinicia un contenedor.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Upstream definitions ─────────────────────────────────────
    upstream backend {
        server backend:8080;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ── Incluir virtual hosts ────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
